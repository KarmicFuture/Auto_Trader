# Copy to config.yaml or set env vars / GitHub Actions secrets.
# Env vars override these values (see README).

watch:
  make: Honda
  model: S2000
  # ZIP for Cars.com / Autotrader / MarketCheck. Leave blank for nationwide.
  zip: ""
  # Max distance in miles from ZIP. Ignored for nationwide (blank ZIP).
  radius_miles: 100
  # Year range (inclusive). S2000 production: 1999–2009.
  year_min: 1999
  year_max: 2009
  max_price: null

sources:
  bringatrailer: true
  # AutoTempest national mash: Cars.com, eBay, Hemmings, CarGurus, TrueCar,
  # Cars & Bids, Carvana (+ CarMax via direct API; other AT codes when available).
  cars_com: true
  autotrader: true
  # Optional: https://www.marketcheck.com/ — free tier works for nearby dealer inventory
  marketcheck: false

notifications:
  # Email (SMTP). Recommended: Gmail app password.
  email:
    enabled: false
    to: vk00345@gmail.com
    from: ""
    smtp_host: smtp.gmail.com
    smtp_port: 587
    smtp_user: ""
    # Prefer env SMTP_PASSWORD — do not commit secrets.
    smtp_password: ""

  # Discord incoming webhook URL (prefer env DISCORD_WEBHOOK_URL)
  discord:
    enabled: false
    webhook_url: ""

  # Open a GitHub issue per new listing (auto-enabled in GitHub Actions).
  github_issues:
    enabled: false
    labels:
      - s2000-alert

# On first run, record current listings as seen without notifying (avoids spam).
# Set to true once if you want an immediate digest of everything currently listed.
notify_existing: false

# ---------------------------------------------------------------------------
# Inbox agent: scan Discord, WhatsApp, and Gmail for important conversations.
# Run with: python -m src.inbox.main   (see docs/INBOX_AGENT.md for setup)
# ---------------------------------------------------------------------------
inbox:
  enabled: true
  # How far back to scan on each run.
  lookback_hours: 24
  # Alert when a message scores at or above this (0-10).
  min_importance: 3
  # Substring matches against sender names/addresses. Big score boost.
  vip_senders: []
  #  - "boss@company.com"
  #  - "Mom"
  # Extra keywords that matter to you (substring match, +3).
  keywords: []
  #  - "s2000"
  #  - "offer accepted"
  # Never alert for these senders / conversations.
  muted_senders: []
  muted_conversations: []

  # Gmail over IMAP. Use a Google app password (env GMAIL_APP_PASSWORD).
  gmail:
    enabled: false
    imap_host: imap.gmail.com
    user: ""
    app_password: ""
    folders: ["INBOX"]
    # Only scan unread mail (recommended; read mail was presumably handled).
    unread_only: true

  # Discord bot (env DISCORD_BOT_TOKEN). The bot must be invited to the
  # servers/channels you want scanned; bots cannot read your personal DMs.
  discord:
    enabled: false
    bot_token: ""
    # Channel IDs to monitor (enable Developer Mode -> right click -> Copy ID).
    channel_ids: []
    # Your Discord user ID, so @mentions of you score higher.
    my_user_id: ""

  # WhatsApp Business Cloud API. Messages arrive via webhook — run
  # `python -m uvicorn src.inbox.whatsapp_webhook:app` (see docs) — and are
  # stored in the JSONL file below, which the scanner reads.
  whatsapp:
    enabled: false
    inbox_file: data/inbox/whatsapp.jsonl

  alerts:
    # Push alerts to a Discord channel via incoming webhook
    # (env INBOX_DISCORD_WEBHOOK_URL; falls back to notifications.discord).
    discord_webhook_url: ""
    # Email alerts reuse notifications.email SMTP settings above.
    # Leave null to follow notifications.email.enabled; set true/false to force.
    email: null
